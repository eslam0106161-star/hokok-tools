name: توليد شرح وأسئلة من كتاب PDF

on:
  workflow_dispatch:
    inputs:
      book_filename:
        description: 'اسم الكتاب (أو جزء مميز منه) اللي عايز تعالجه بس — سيبها فاضية عشان يعالج كل الكتب الموجودة في input/'
        required: false
        default: ''
        type: string
      model:
        description: 'نموذج Gemini'
        required: false
        default: 'gemini-3.5-flash-lite'
        type: choice
        options:
          - gemini-3.5-flash-lite
          - gemini-3.6-flash
      word_count:
        description: 'طول الشرح لكل جزء'
        required: false
        default: 'medium'
        type: choice
        options:
          - short
          - medium
          - long
      mcq_count:
        description: 'عدد أسئلة الاختيار من متعدد لكل جزء'
        required: false
        default: '5'
        type: choice
        options:
          - '3'
          - '5'
          - '7'
      essay_count:
        description: 'عدد الأسئلة المقالية لكل جزء'
        required: false
        default: '3'
        type: choice
        options:
          - '2'
          - '3'
          - '4'
      tf_count:
        description: 'عدد أسئلة الصح والخطأ لكل جزء'
        required: false
        default: '5'
        type: choice
        options:
          - '0'
          - '3'
          - '5'
          - '7'
      skip_footnotes:
        description: 'تجاهل الهوامش أسفل الصفحة'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      verify_extraction:
        description: 'مراجعة دقة النص المستخرج من كل صفحة (أرقام/أسماء) — بيضاعف وقت مرحلة الاستخراج تقريبًا'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      verify_content:
        description: 'مراجعة الشرح والأسئلة مقابل النص الأصلي (منع التأليف، دقة الأرقام، صحة إجابات الاختيار) — بيضاعف وقت مرحلة التوليد تقريبًا'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      verify_structure:
        description: 'تصنيف ذكي لمستوى العناوين الغامضة (أولاً/ثانياً أو عنوان مكتشف بصريًا) بناءً على سياق الكتاب الكامل — استدعاء واحد رخيص لكل كتاب'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

jobs:
  generate:
    runs-on: ubuntu-latest
    # الحد الأقصى لتشغيل أي Job على GitHub Actions هو 6 ساعات (360 دقيقة) — قيد من المنصة نفسها
    timeout-minutes: 350
    steps:
      - name: تنزيل الريبو
        uses: actions/checkout@v4

      - name: تثبيت أداة تحويل PDF لصور (poppler-utils)
        run: sudo apt-get update -y && sudo apt-get install -y poppler-utils

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت مكتبات المشروع
        working-directory: tools-node
        run: npm install --no-audit --no-fund

      - name: تشغيل خط الأنابيب الكامل
        working-directory: tools-node
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          BOOK_FILENAME: ${{ inputs.book_filename }}
          GEMINI_MODEL: ${{ inputs.model }}
          WORD_COUNT: ${{ inputs.word_count }}
          MCQ_COUNT: ${{ inputs.mcq_count }}
          ESSAY_COUNT: ${{ inputs.essay_count }}
          TF_COUNT: ${{ inputs.tf_count }}
          SKIP_FOOTNOTES: ${{ inputs.skip_footnotes }}
          VERIFY_EXTRACTION: ${{ inputs.verify_extraction }}
          VERIFY_CONTENT: ${{ inputs.verify_content }}
          VERIFY_STRUCTURE: ${{ inputs.verify_structure }}
        run: node generate-book.js

      - name: رفع الملفات الناتجة (Word + النص المستخرج)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-output-${{ github.run_number }}
          path: output/
          retention-days: 14
